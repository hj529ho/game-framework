[project]
name = "game-framework"
version = "0.1.0"
description = "A 2D game engine built on SDL2"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["src"]
